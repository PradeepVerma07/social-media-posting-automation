server {
    server_name n8n.webtrionix.com;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Strip all frame and cross-origin blocking headers from n8n
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        # Authorize embedding inside dashboard
        add_header Content-Security-Policy "frame-ancestors 'self' https://360.webtrionix.com https://*.webtrionix.com;" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        client_max_body_size 50M;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/n8n.webtrionix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.webtrionix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = n8n.webtrionix.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name n8n.webtrionix.com;
    return 404;
}
